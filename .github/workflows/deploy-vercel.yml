# Deploy to Vercel (production) on every push to main.
#
# WHY: relying on Vercel's Git integration alone has been unreliable for this
# project (pushes to main did not always reach storyboard.aiglobalvn.com).
# This workflow deploys to production explicitly from GitHub's own runners and
# shows a green/red status on each commit, so "pushed" always means "deployed".
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions → New secret):
#   - VERCEL_TOKEN       (Vercel → Account Settings → Tokens → Create)
#   - VERCEL_ORG_ID      (Vercel → project → Settings → General, or .vercel/project.json)
#   - VERCEL_PROJECT_ID  (same place)
# Until VERCEL_TOKEN is set, this workflow runs but SKIPS the deploy (green, no error).

name: Deploy to Vercel (production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one production deploy at a time; newer pushes cancel older in-flight runs.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that a Vercel token is configured
        id: guard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN secret is not set — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in repo Settings → Secrets to enable automatic production deploys."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.guard.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.guard.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel production env
        if: steps.guard.outputs.has_token == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (production)
        if: steps.guard.outputs.has_token == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        if: steps.guard.outputs.has_token == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
